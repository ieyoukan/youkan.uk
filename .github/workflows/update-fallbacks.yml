# pixiv のピックアップ作品・BOOTH の商品を定期取得して src/data/*-fallback.json を更新する。
# Cloudflare Pages のビルド環境からは pixiv が 403 を返すため（src/lib/pixiv.ts 参照）、
# GitHub Actions で取得してコミットし、そのコミットで Cloudflare Pages を再デプロイさせる。
name: Update fallbacks

on:
  schedule:
    # 毎日 18:00 JST（絵・商品を上げる頻度が高くないので日次で十分）
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # 依存パッケージは不要（node の標準 API と型ストリップだけで動く）
      # 片方が失敗してももう片方は更新する
      - run: node scripts/update-pixiv-fallback.mjs
        continue-on-error: true
      - run: node scripts/update-booth-fallback.mjs
        continue-on-error: true

      - name: Commit if changed
        run: |
          if git diff --quiet -- src/data; then
            echo "変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add src/data
          git commit -m "pixiv / BOOTH のフォールバックを更新"
          git push
